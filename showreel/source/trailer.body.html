<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="fg" cx="50%" cy="80%" r="60%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5a2a"/></radialGradient>
      <g id="flame-shape">
        <path d="M0 0C-39-4-32-40-15-55C-15-35-6-32-7-47C-8-65 7-83 12-94C14-61 46-43 28-13C22-2 11 3 0 0Z" fill="url(#fg)"/>
        <path class="core" d="M0-2C-15-14-9-30 3-48C3-33 20-26 14-12C12-5 5 0 0-2Z" fill="#fff1b0"/>
      </g>
    </defs>
  </svg>

  <!-- 1 · tensão (0–6 s) -->
  <section class="scene" id="t-intro">
    <div class="tline" id="tl0">Todo dia começa igual.</div>
    <div class="tline" id="tl1">Metas demais.</div>
    <div class="tline" id="tl2">Tempo de menos.</div>
    <div class="tline" id="tl3">Nenhum ritmo.</div>
    <div class="tline" id="tl4">E se cada passo<br><span style="color:#ffb46a">acendesse algo?</span></div>
    <svg id="ember" class="abs" viewBox="-60 -110 120 120" width="200" height="200" style="left:860px;top:690px;overflow:visible"><use href="#flame-shape"/></svg>
  </section>

  <!-- 2 · ignição + logo (6–7,5 s) -->
  <section class="scene" id="t-logo">
    <svg id="logo-fire" class="abs" viewBox="-60 -110 120 120" width="420" height="420" style="left:750px;top:110px;overflow:visible"><use href="#flame-shape"/></svg>
    <div id="logo-word" class="abs mega" style="left:0;right:0;top:600px;text-align:center;font-size:210px;letter-spacing:.2em;padding-left:.2em"></div>
  </section>

  <!-- 3 · montagem das funções (7,5–19,5 s): oito cortes gerados em trailer.scene.js -->
  <div id="cuts"></div>

  <!-- 4 · respiro (19,5–23 s) -->
  <section class="scene" id="t-wall">
    <div id="tw-wall" class="abs" style="left:960px;top:540px;transform-style:preserve-3d"></div>
    <div id="tw-shade" class="abs" style="inset:0;background:radial-gradient(60% 55% at 50% 50%,rgba(5,5,8,.82),rgba(5,5,8,.35) 70%,transparent)"></div>
    <div class="wline" id="wl0">UM SISTEMA.</div>
    <div class="wline" id="wl1">UMA FOGUEIRA.</div>
    <div class="wline" id="wl2" style="color:#b79cff">A SUA JORNADA.</div>
  </section>

  <!-- 5 · clímax (23–27 s) -->
  <section class="scene" id="t-peak">
    <svg id="peak-fire" class="abs" viewBox="-60 -110 120 120" width="260" height="260" style="left:560px;top:250px;overflow:visible"><use href="#flame-shape"/></svg>
    <div id="peak-n" class="abs mega" style="left:850px;top:250px;font-size:300px;font-variant-numeric:tabular-nums">1</div>
    <div id="peak-label" class="abs hud" style="left:860px;top:540px;font-size:30px">dias seguidos</div>
    <div id="peak-tag1" class="abs mega" style="left:0;right:0;top:660px;text-align:center;font-size:120px">ACENDA</div>
    <div id="peak-tag2" class="abs mega" style="left:0;right:0;top:780px;text-align:center;font-size:120px;color:#9c7de8">TODOS OS DIAS.</div>
  </section>

  <!-- 6 · cartela final (27–30 s) -->
  <section class="scene" id="t-end">
    <svg id="end-fire" class="abs" viewBox="-60 -110 120 120" width="280" height="280" style="left:820px;top:120px;overflow:visible"><use href="#flame-shape"/></svg>
    <div id="end-logo" class="abs mega" style="left:0;right:0;top:430px;text-align:center;font-size:180px;letter-spacing:.2em;padding-left:.2em">CAVERN</div>
    <div id="end-cta" class="abs" style="left:0;right:0;top:660px;text-align:center"><span id="end-cta-chip">Disponível agora</span></div>
    <div id="end-platforms" class="abs hud" style="left:0;right:0;top:790px;text-align:center;font-size:26px">Android · Web · Desktop</div>
    <div id="end-small" class="abs hud" style="left:0;right:0;top:900px;text-align:center;font-size:18px;opacity:.6">Seus hábitos, seu ritmo, sua fogueira.</div>
  </section>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="flash"></div>
  <div id="letterbox"></div>
</div>
